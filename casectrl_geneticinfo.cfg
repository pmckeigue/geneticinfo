# Config for saved_casectrl_geneticinfo.py
# Used with run_dnanexus_job.sh.
#
# Expected environment variables (export before calling run_dnanexus_job.sh):
#   PHENO             phenotype name, e.g. "RA"
#   SLICE_W           slice sampler initial width, e.g. "1.0"
#   JAGS_ADAPT        "true" to enable JAGS-style width adaptation, "false" otherwise
#   N_WARMUP_PHASE1   iterations in fixed-width phase before adaptation begins (default 0)

SCRIPT_NAME="saved_casectrl_geneticinfo.py"
EXTRA_UPLOADS=(pg_gibbs_clean.py)

REMOTE_FOLDER="ancestry_kinship"
SNAPSHOT=".Notebook_snapshots/snapshot-jupyterlab-pheno.tar.gz"
INSTANCE_TYPE="mem2_ssd1_v2_x16"
REMOTE_OUTPUT_DIR="/summarylevel_results"

N_WARMUP_PHASE1="${N_WARMUP_PHASE1:-0}"
JOB_CMD="python3 ${SCRIPT_NAME} ${PHENO} ${SLICE_W} ${JAGS_ADAPT} ${N_WARMUP_PHASE1}"
JOB_NAME="genetic info ${PHENO} sw${SLICE_W} adapt=${JAGS_ADAPT} p1=${N_WARMUP_PHASE1}"

# Suffix matches what saved_casectrl_geneticinfo.py writes
if [[ "${JAGS_ADAPT}" == "true" ]]; then
    _SUFFIX="sw${SLICE_W}_adapted"
else
    _SUFFIX="sw${SLICE_W}"
fi

RESULT_FILES=(
    "results_${PHENO}_${_SUFFIX}.npz"
    "posterior_${PHENO}_${_SUFFIX}.png"
)

LOCAL_OUTPUT_DIR="summarylevel_results/${PHENO}"
